<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Score Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ffe6f0;
      padding: 40px;
    }

    h1 {
      background-color: #ff66b2;
      color: white;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
    }

    .subtext {
      font-style: italic;
      margin-bottom: 30px;
    }

    .subjects {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .subject {
      width: 180px;
    }

    .subject img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .subject input {
      margin-top: 10px;
      width: 100%;
      font-size: 18px;
      text-align: center;
      padding: 8px;
      border: none;
      background-color: #fff0f5;
      border-radius: 6px;
    }

    button {
      background-color: #ff66b2;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #e0559c;
    }

    .note {
      margin-top: 30px;
      font-size: 12px;
      color: #444;
      font-style: italic;
    }

    footer {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>
<h1>Score Analyzer</h1>
  <div class="subtext" onclick="toggleSubtext()">▼ Click Me<br>Enter your grades in the following subjects.</div>
  <div class="subtext-content" id="subtextContent">
    <p>Please enter your grades for each subject to calculate your average score.</p>
  </div>

  <div class="subjects">
    <div class="subject">
      <img src="/var/folders/d2/r99ptdfs28qgx4_1pyf8pbdc0000gn/T/TemporaryItems/NSIRD_screencaptureui_1cTiow/Screenshot%202025-04-30%20at%209.27.39%E2%80%AFAM.png" alt="Science">
      <input type="number" id="science" placeholder="Science">
    </div>
    <div class="subject">
      <img src="https://i.pinimg.com/736x/53/e2/08/53e208c4dd68574c820a2ffd0fd2d657.jpg" alt="Math">
      <input type="number" id="math" placeholder="Math">
    </div>
    <div class="subject">
      <img src="https://i.pinimg.com/736x/cf/6c/a8/cf6ca808ba2b371252062fffea55a180.jpg" alt="English">
      <input type="number" id="english" placeholder="English">
    </div>
  </div>

  <button onclick="getRating()">Get Rating</button>

  <div class="footer">
 <a href="https://docs.google.com/document/d/1SXU1VBw83uEjZw6S1VHMPeZZgOEl_q8mvvag0Q1jDDc/edit?usp=sharing">Sources</a><br>
  <footer>Cas Santos</footer>


  <script>
    function getRating() {
      const sci = parseFloat(document.getElementById('science').value);
      const math = parseFloat(document.getElementById('math').value);
      const eng = parseFloat(document.getElementById('english').value);

      if (isNaN(sci) || isNaN(math) || isNaN(eng)) {
        alert("Please enter all grades.");
        return;
      }

      const avg = ((sci + math + eng) / 3).toFixed(2);
      let rating = "";

     
      switch (true) {
        case (avg >= 94 && avg <= 100):
          rating = "Excellent";
          break;
        case (avg >= 87 && avg <= 93.99):
          rating = "Above Satisfactory";
          break;
        case (avg >= 80 && avg <= 86.99):
          rating = "Satisfactory";
          break;
        case (avg >= 75 && avg <= 79.99):
          rating = "Needs Improvement";
          break;
        case (avg >= 70 && avg <= 74.99):
          rating = "Poor";
          break;
        default:
          rating = "Invalid Grade";
      }

      alert(`Your average is ${avg} - ${rating}`);
    }
  </script>

</body>
</html>
